<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journali — Legal</title>
<meta name="description" content="Privacy policy and terms of use for Journali, a language-learning journaling app for iOS.">
<style>
  :root { color-scheme: light dark; --fg:#1c1c1e; --muted:#6c6c70; --bg:#fff; --rule:#e5e5ea; --link:#c2185b; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f7; --muted:#aeaeb2; --bg:#000; --rule:#2c2c2e; --link:#ff6b9d; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:42rem; margin:0 auto; padding:4rem 1.25rem; }
  h1 { font-size:2rem; letter-spacing:-0.02em; margin:0 0 0.5rem; }
  p { color:var(--muted); margin:0 0 2rem; }
  a.card { display:block; padding:1rem 1.25rem; margin:0 0 0.75rem; border:1px solid var(--rule); border-radius:14px; color:var(--fg); text-decoration:none; }
  a.card strong { display:block; font-size:1.05rem; }
  a.card span { color:var(--muted); font-size:0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Journali</h1>
  <p>Legal information for the Journali iOS app.</p>
  <a class="card" href="privacy-policy.html"><strong>Privacy Policy</strong><span>What is stored on your device and what leaves it</span></a>
  <a class="card" href="terms.html"><strong>Terms of Use</strong><span>Licence, third-party providers, and warranty</span></a>
</main>
</body>
</html>
